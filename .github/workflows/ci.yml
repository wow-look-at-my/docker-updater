name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  checks: read
  artifact-metadata: write
  deployments: write

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master

  dashboard:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 for native TypeScript type stripping: snapshot.test.mts runs as authored, with no build step.
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - name: Verify dashboard.js is up to date with dashboard.ts
        run: |
          npm run build
          git diff --exit-code dashboard.js
      # Runs against the compiled dashboard.js verified above, not source nobody ships.
      - run: npm test

  # Publishing waits on this: an image that cannot start is the one defect the unit tests structurally cannot see.
  image-e2e:
    needs: test
    # A self-hosted runner carries a registered APE binfmt handler, which makes the kernel run any APE through a shell and masks this defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats
      # go-toolchain hands build/ over through the org cache, and the image copies the binary from there.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build/
      - run: chmod +x build/docker-updater
      # Building the image is not an assertion. Every assertion is in the suite.
      - run: docker build -t docker-updater:ci .
      - env:
          DU_IMAGE: docker-updater:ci
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/image.dats

  publish-ghcr:
    needs: [test, image-e2e]
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master

  # image-e2e starts an image it built itself; publish-ghcr builds and pushes another, so this starts the bytes that shipped.
  published-image-e2e:
    needs: publish-ghcr
    if: github.ref == 'refs/heads/master'
    # Same reason as image-e2e: a self-hosted runner carries an APE binfmt handler, which makes a bare exec succeed and hides the defect.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
        with:
          project: dats
      # Fetching is setup. The suite below is what starts the container and asserts it reaches the update loop.
      - name: Fetch the published image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/wow-look-at-my/docker-updater:latest
      - name: Start the published image and assert it reaches the update loop
        env:
          DU_IMAGE: ghcr.io/wow-look-at-my/docker-updater:latest
        run: sh "$RUNNER_TEMP/dats" --no-sandbox -v test test/dats/image.dats

  publish-buildhost:
    needs: test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # go-toolchain hands build/ over through the org cache, not upload-artifact, so buildhost-publish's artifact mode finds nothing; restore it and publish the directory.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build/
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build
