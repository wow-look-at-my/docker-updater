# The go:generate directives in dashboard.go compile dashboard.js, which the embed needs and which is not committed.

name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  checks: read
  artifact-metadata: write
  deployments: write

jobs:
  test:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The go:generate directives in dashboard.go compile dashboard.js, which the embed needs and which is not committed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          generate: 5ad8eacfc541

  dashboard:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: npm ci
      - run: just typecheck
      - run: just build
      # Runs against the compiled dashboard.js, not source nobody ships.
      - run: just test

  # Publishing waits on this: an image that cannot start is the one defect the unit tests structurally cannot see.
  image-e2e:
    needs: test
    # A self-hosted runner carries a registered APE binfmt handler, which makes the kernel run any APE through a shell and masks this defect.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER_DIND || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: dats
      # go-toolchain hands build/ over through the org cache, and the image copies the binary from there.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build/
      - run: chmod +x build/docker-updater
      # The suite runs docker compose, and the dind runner image ships no compose plugin.
      - run: sudo apt-get update && sudo apt-get install -y docker-compose-v2 && docker compose version
      # Building the image is not an assertion. Every assertion is in the suite.
      - run: docker build -t docker-updater:ci .
      - env:
          DU_IMAGE: docker-updater:ci
        run: sh "${{ runner.temp }}/dats" --no-sandbox -v test test/dats/image.dats

  publish-ghcr:
    needs: [test, image-e2e]
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@lkgb

  # image-e2e is the only job that executes the APE these bytes are.
  publish-buildhost:
    needs: [test, image-e2e]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # go-toolchain hands build/ over through the org cache, not upload-artifact, so buildhost-publish's artifact mode finds nothing; restore it and publish the directory.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test.broot
          path: build/
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@lkgb
        with:
          path: build
