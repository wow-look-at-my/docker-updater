name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - name: Verify dashboard.js is up to date with dashboard.ts
        run: |
          npm run build
          git diff --exit-code dashboard.js

  publish-ghcr:
    needs: test
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master

  publish-buildhost:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
