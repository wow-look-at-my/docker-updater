name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  packages: write
  actions: read
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - name: Verify dashboard.js is up to date with dashboard.ts
        run: |
          npm run build
          git diff --exit-code dashboard.js

  publish-ghcr:
    needs: test
    uses: wow-look-at-my/actions/.github/workflows/publish-ghcr.yml@master

  publish-buildhost:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
      # go-toolchain hands its build/ outputs to later jobs through the org
      # cache-upload action, not actions/upload-artifact, so buildhost-publish's
      # default artifact mode finds nothing ("Artifact 'go-build' not found in
      # run"). Restore the hand-off and publish from the directory instead --
      # the same shape go-toolchain's own publish job uses. The name is explicit
      # rather than nameless self-discovery because go-toolchain still saves the
      # deprecated bare `go-build` alias alongside `go-build-<job>`, and a run
      # with two hand-offs makes nameless discovery a hard error by design.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test
          path: build/
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
        with:
          path: build
